    <ellipse cx="470" cy="238" rx="46" ry="14" fill="#f3ecdc"/>
    <ellipse cx="470" cy="238" rx="20" ry="7" fill="#c6bba4"/>
    <path d="M428 276h85M431 310h79M434 344h74M437 378h69M440 412h63M443 446h57" stroke="#cec3ab" stroke-width="3" fill="none"/>
