<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Combed cotton yarn</title>
  <desc id="desc">A studio render of three combed cotton yarn cones in natural cream tones.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop stop-color="#f0ece2"/>
      <stop offset="1" stop-color="#ded7c8"/>
    </linearGradient>
    <linearGradient id="cream" x2="1" y2="0">
      <stop stop-color="#fdfbf4"/>
      <stop offset="0.5" stop-color="#f2ecdd"/>
      <stop offset="1" stop-color="#ddd4c0"/>
    </linearGradient>
    <linearGradient id="sand" x2="1" y2="0">
      <stop stop-color="#f4eedf"/>
      <stop offset="0.55" stop-color="#e8dfca"/>
      <stop offset="1" stop-color="#cfc4ac"/>
    </linearGradient>
    <radialGradient id="shadow">
      <stop stop-color="#2d403a" stop-opacity=".25"/>
      <stop offset="1" stop-color="#2d403a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
